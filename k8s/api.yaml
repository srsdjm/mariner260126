---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mariner-dev
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mariner-api
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5005
              name: jdwp
          env:
            - name: DATABASE_SERVICE_URL
              value: "jdbc:postgresql://db:5432/mariner?user=mariner&password=mariner"
            - name: PII_ENCRYPTION_KEY
              value: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEh"
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mariner-dev
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 5005
      targetPort: 5005
      name: jdwp
