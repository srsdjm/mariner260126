name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mariner
      POSTGRES_PASSWORD: mariner
      POSTGRES_DB: mariner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mariner -d mariner -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runtime DB connection uses the Compose network (db:5432).
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL}
      # Encryption key for sensitive PII (Base64-encoded 256-bit key).
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./web
      target: prod
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

volumes:
  pgdata:
