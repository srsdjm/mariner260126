services:
  db:
    # Dev-only host exposure for local tooling.
    ports:
      - "${DB_HOST_PORT:-5432}:5432"

  api:
    environment:
      # Dev-only: allow API to use the service URL; host tools use DATABASE_HOST_URL.
      DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL}
      # Dev-only debug port for JDWP.
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      # Dev-only host port for JDWP debugging.
      - "5005:5005"

  web:
    build:
      context: ./web
      target: dev
    volumes:
      # Dev-only bind mount for hot reload.
      - ${WORKSPACE_HOST_PATH:-.}/web:/workspace
      # Keep container-installed deps available when the bind mount hides /workspace.
      - web_node_modules:/workspace/node_modules
    ports:
      # Dev-only Vite dev server port.
      - "5173:5173"

  browser:
    build:
      context: ./browser
    ipc: host
    shm_size: "4gb"
    environment:
      - DISPLAY=:99
      - MCP_PORT=7331
      - NOVNC_PORT=6080
      - SCREEN_RES=1920x1080x24
      - VNC_PORT=5900
    ports:
      - "6080:6080"
      - "5900:5900"
      - "7331:7331"

volumes:
  web_node_modules:
